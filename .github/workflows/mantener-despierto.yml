# Supabase gratuito se pausa tras ~7 días sin uso.
# Esta tarea hace una consulta pequeña cada 3 días para que no se duerma.
name: Mantener Supabase despierto
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consultar la base de datos
        run: |
          set -a; . ./.env.production; set +a
          curl -sS --fail -o /dev/null -w "Supabase respondió %{http_code}\n" \
            "$VITE_SUPABASE_URL/rest/v1/games?select=id&limit=1" \
            -H "apikey: $VITE_SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $VITE_SUPABASE_ANON_KEY"
